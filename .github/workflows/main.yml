name: Unzip and Commit Files

on:
  push:
    branches:
      - main  # Apni main branch ka naam
  workflow_dispatch:

jobs:
  unzip-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Commit push karne ke liye required hai

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract code.zip
        run: |
          if [ -f "code.zip" ]; then
            # Direct root mai extract karne ke liye '.' use kiya hai
            unzip -o code.zip -d .
            echo "Successfully unzipped code.zip"
          else
            echo "code.zip not found!"
            exit 1
          fi

      - name: Commit and Push Extracted Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Extracted files add karein
          git add .

          # Changes check karke commit karein
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: extract code.zip files into repository"
            git push
          fi
