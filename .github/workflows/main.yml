name: Unzip Code Archive

on:
  push:
    branches:
      - main  # Ya apni default branch ka naam dein
  workflow_dispatch: # Manual trigger ke liye

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract code.zip
        run: |
          if [ -f "code.zip" ]; then
            unzip code.zip -d extracted_code
            echo "Successfully unzipped code.zip"
          else
            echo "code.zip not found in the repository root!"
            exit 1
          fi

      - name: View Extracted Files
        run: ls -la extracted_code
        
